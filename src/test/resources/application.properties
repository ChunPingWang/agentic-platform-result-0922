spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable Redis for tests
spring.data.redis.host=localhost
spring.data.redis.port=6370
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

app.cache.rate.ttl-seconds=300
app.jwt.secret=ThisIsAVeryLongSecretKeyForJwtSigningPurposesAtLeast256BitsLong!
app.jwt.expiration-ms=3600000