spring.application.name=life-premium

# PostgreSQL (production)
spring.datasource.url=jdbc:postgresql://localhost:5432/lifepremium
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Cache TTL seconds
app.cache.rate.ttl-seconds=300

# JWT
app.jwt.secret=ThisIsAVeryLongSecretKeyForJwtSigningPurposesAtLeast256BitsLong!
app.jwt.expiration-ms=3600000